<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Voxel Craft (Minecraft Clone)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Simplex Noise for Procedural Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background-color: #111;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 2px rgba(0, 0, 0, 0.8);
        }
        #crosshair::before {
            left: 7px;
            top: 0;
            width: 2px;
            height: 16px;
        }
        #crosshair::after {
            left: 0;
            top: 7px;
            width: 16px;
            height: 2px;
        }
        .hotbar-slot {
            width: 52px;
            height: 52px;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            backdrop-filter: blur(4px);
        }
        .hotbar-slot.active {
            border-color: #4f46e5;
            background: rgba(79, 70, 229, 0.3);
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.6);
        }
        .hotbar-slot:hover:not(.active) {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.1);
        }
        .slot-key {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 10px;
            font-weight: bold;
            color: #ddd;
            text-shadow: 1px 1px 2px black;
        }
        .block-preview {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="relative w-screen h-screen">

    <!-- Crosshair -->
    <div id="crosshair"></div>

    <!-- UI Overlay / Instructions -->
    <div id="instructions" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-black/70 backdrop-blur-md text-white transition-opacity duration-300">
        <div class="bg-gray-900/90 p-8 rounded-2xl border border-gray-700 shadow-2xl text-center max-w-lg mx-4">
            <h1 class="text-4xl font-extrabold mb-2 text-indigo-400 tracking-wider">3D VOXEL CRAFT</h1>
            <p class="text-gray-300 mb-6 text-sm">Упрощённая копия Minecraft на HTML5 & Three.js</p>
            
            <div class="grid grid-cols-2 gap-3 text-left mb-6 text-xs bg-gray-800/80 p-4 rounded-xl border border-gray-700">
                <div class="flex items-center space-x-2"><span class="px-2 py-1 bg-gray-700 rounded font-mono text-indigo-300">WASD</span> <span>Перемещение</span></div>
                <div class="flex items-center space-x-2"><span class="px-2 py-1 bg-gray-700 rounded font-mono text-indigo-300">Пробел</span> <span>Прыжок</span></div>
                <div class="flex items-center space-x-2"><span class="px-2 py-1 bg-gray-700 rounded font-mono text-indigo-300">ЛКМ</span> <span>Ломать блок</span></div>
                <div class="flex items-center space-x-2"><span class="px-2 py-1 bg-gray-700 rounded font-mono text-indigo-300">ПКМ</span> <span>Ставить блок</span></div>
                <div class="flex items-center space-x-2"><span class="px-2 py-1 bg-gray-700 rounded font-mono text-indigo-300">1 - 7</span> <span>Выбор блока</span></div>
                <div class="flex items-center space-x-2"><span class="px-2 py-1 bg-gray-700 rounded font-mono text-indigo-300">Мышь</span> <span>Обзор (Pointer Lock)</span></div>
            </div>

            <button id="playBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition transform hover:-translate-y-0.5">
                Начать игру
            </button>
        </div>
    </div>

    <!-- Stats HUD -->
    <div class="absolute top-4 left-4 z-10 bg-black/50 backdrop-blur-md border border-white/10 px-4 py-2 rounded-xl text-white text-xs font-mono space-y-1 pointer-events-none">
        <div>FPS: <span id="fpsCounter" class="text-green-400">60</span></div>
        <div>Координаты: <span id="posCounter" class="text-indigo-300">X: 0, Y: 0, Z: 0</span></div>
        <div>Блоков в мире: <span id="blockCount" class="text-amber-300">0</span></div>
    </div>

    <!-- Hotbar Container -->
    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-10 flex space-x-2 p-2 bg-black/40 backdrop-blur-md rounded-2xl border border-white/10 shadow-2xl">
        <div class="hotbar-slot active" data-index="0" data-type="grass">
            <span class="slot-key">1</span>
            <div class="block-preview bg-emerald-600"></div>
        </div>
        <div class="hotbar-slot" data-index="1" data-type="dirt">
            <span class="slot-key">2</span>
            <div class="block-preview bg-amber-800"></div>
        </div>
        <div class="hotbar-slot" data-index="2" data-type="stone">
            <span class="slot-key">3</span>
            <div class="block-preview bg-gray-500"></div>
        </div>
        <div class="hotbar-slot" data-index="3" data-type="wood">
            <span class="slot-key">4</span>
            <div class="block-preview bg-amber-950"></div>
        </div>
        <div class="hotbar-slot" data-index="4" data-type="leaves">
            <span class="slot-key">5</span>
            <div class="block-preview bg-green-700"></div>
        </div>
        <div class="hotbar-slot" data-index="5" data-type="brick">
            <span class="slot-key">6</span>
            <div class="block-preview bg-red-700"></div>
        </div>
        <div class="hotbar-slot" data-index="6" data-type="glass">
            <span class="slot-key">7</span>
            <div class="block-preview bg-cyan-200/60 border border-white/50"></div>
        </div>
    </div>

    <!-- WebAudio Sound Generator -->
    <script>
        // Simple procedural audio generator
        class SoundFX {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }

            playBreak() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.1);
                
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.1);
            }

            playPlace() {
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.08);
                
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.08);

                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        }
        const sfx = new SoundFX();
    </script>

    <!-- Main Game Logic -->
    <script>
        // --- Game Setup & State ---
        const BLOCK_SIZE = 1;
        const WORLD_SIZE = 32; // 32x32 blocks terrain
        const CHUNK_HEIGHT = 16;
        
        let scene, camera, renderer;
        let blocks = new Map(); // World blocks map with "x,y,z" as keys
        let simplex = new SimplexNoise();
        let selectedBlockType = 'grass';
        let blockTypes = ['grass', 'dirt', 'stone', 'wood', 'leaves', 'brick', 'glass'];

        // Physics & Controls
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();
        let prevTime = performance.now();
        let isLocked = false;

        // Textures & Materials
        const materials = {};
        const highlightMesh = createHighlightMesh();

        // Canvas texture generator for procedural voxel textures
        function createProceduralTexture(colorHex, noiseAmount = 0.15, gridBorder = true) {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = colorHex;
            ctx.fillRect(0, 0, 64, 64);

            const imgData = ctx.getImageData(0, 0, 64, 64);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                const noise = (Math.random() - 0.5) * noiseAmount * 255;
                data[i] = Math.min(255, Math.max(0, data[i] + noise));
                data[i+1] = Math.min(255, Math.max(0, data[i+1] + noise));
                data[i+2] = Math.min(255, Math.max(0, data[i+2] + noise));
            }
            ctx.putImageData(imgData, 0, 0);

            if (gridBorder) {
                ctx.strokeStyle = 'rgba(0,0,0,0.15)';
                ctx.lineWidth = 2;
                ctx.strokeRect(0, 0, 64, 64);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        // Initialize Materials
        function initMaterials() {
            const grassTop = createProceduralTexture('#4ade80', 0.1);
            const grassSide = createProceduralTexture('#854d0e', 0.15);
            const dirt = createProceduralTexture('#78350f', 0.15);
            const stone = createProceduralTexture('#6b7280', 0.2);
            const wood = createProceduralTexture('#451a03', 0.1);
            const leaves = createProceduralTexture('#15803d', 0.2);
            const brick = createProceduralTexture('#b91c1c', 0.1);
            const glass = createProceduralTexture('#a5f3fc', 0.05);

            materials.dirt = new THREE.MeshLambertMaterial({ map: dirt });
            materials.stone = new THREE.MeshLambertMaterial({ map: stone });
            materials.wood = new THREE.MeshLambertMaterial({ map: wood });
            materials.leaves = new THREE.MeshLambertMaterial({ map: leaves, transparent: true, opacity: 0.9 });
            materials.brick = new THREE.MeshLambertMaterial({ map: brick });
            materials.glass = new THREE.MeshLambertMaterial({ map: glass, transparent: true, opacity: 0.5 });

            // Grass has top green, bottom brown, sides hybrid
            const grassSideMat = new THREE.MeshLambertMaterial({ map: grassSide });
            const grassTopMat = new THREE.MeshLambertMaterial({ map: grassTop });
            materials.grass = [
                grassSideMat, grassSideMat,
                grassTopMat, dirt,
                grassSideMat, grassSideMat
            ];
        }

        function createHighlightMesh() {
            const geom = new THREE.BoxGeometry(1.01, 1.01, 1.01);
            const wireframe = new THREE.WireframeGeometry(geom);
            const line = new THREE.LineSegments(wireframe);
            line.material.color.setHex(0x000000);
            line.material.linewidth = 2;
            line.visible = false;
            return line;
        }

        // Initialize Scene
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x78a7ff); // Sky blue
            scene.fog = new THREE.FogExp2(0x78a7ff, 0.025);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(WORLD_SIZE / 2, 12, WORLD_SIZE / 2);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Ambient & Directional Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(50, 80, 30);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 150;
            const d = 40;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            initMaterials();
            scene.add(highlightMesh);

            generateWorld();
            setupControls();

            window.addEventListener('resize', onWindowResize);
        }

        // Procedural World Generation
        const geometryCache = new THREE.BoxGeometry(1, 1, 1);

        function setBlock(x, y, z, type) {
            const key = `${x},${y},${z}`;
            if (blocks.has(key)) {
                scene.remove(blocks.get(key));
                blocks.delete(key);
            }

            if (type) {
                const mat = materials[type];
                const mesh = new THREE.Mesh(geometryCache, mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.userData = { x, y, z, type };
                scene.add(mesh);
                blocks.set(key, mesh);
            }
        }

        function generateWorld() {
            for (let x = 0; x < WORLD_SIZE; x++) {
                for (let z = 0; z < WORLD_SIZE; z++) {
                    // Height calculation via noise
                    let height = Math.floor(simplex.noise2D(x * 0.05, z * 0.05) * 4 + 6);

                    for (let y = 0; y <= height; y++) {
                        if (y === height) {
                            setBlock(x, y, z, 'grass');
                        } else if (y > height - 3) {
                            setBlock(x, y, z, 'dirt');
                        } else {
                            setBlock(x, y, z, 'stone');
                        }
                    }

                    // Random trees
                    if (x > 2 && x < WORLD_SIZE - 2 && z > 2 && z < WORLD_SIZE - 2) {
                        if (Math.random() < 0.015) {
                            generateTree(x, height + 1, z);
                        }
                    }
                }
            }
            updateBlockCountUI();
        }

        function generateTree(x, y, z) {
            const trunkHeight = 4 + Math.floor(Math.random() * 2);
            for (let i = 0; i < trunkHeight; i++) {
                setBlock(x, y + i, z, 'wood');
            }
            // Leaves crown
            for (let lx = -2; lx <= 2; lx++) {
                for (let lz = -2; lz <= 2; lz++) {
                    for (let ly = trunkHeight - 1; ly <= trunkHeight + 1; ly++) {
                        if (Math.abs(lx) === 2 && Math.abs(lz) === 2) continue;
                        if (lx === 0 && lz === 0 && ly < trunkHeight) continue;
                        setBlock(x + lx, y + ly, z + lz, 'leaves');
                    }
                }
            }
        }

        // Pointer Lock & Controls Handling
        function setupControls() {
            const instructions = document.getElementById('instructions');
            const playBtn = document.getElementById('playBtn');

            playBtn.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    isLocked = true;
                    instructions.classList.add('opacity-0', 'pointer-events-none');
                } else {
                    isLocked = false;
                    instructions.classList.remove('opacity-0', 'pointer-events-none');
                }
            });

            // Mouse Look (Fixed pitch clamping to prevent neck breaking & inverted controls)
            document.addEventListener('mousemove', (event) => {
                if (!isLocked) return;
                const movementX = event.movementX || 0;
                const movementY = event.movementY || 0;

                // Adjust yaw (horizontal) and pitch (vertical) smoothly
                camera.rotation.y -= movementX * 0.002;
                camera.rotation.x -= movementY * 0.002;

                // Clamp pitch between -85 and +85 degrees to prevent 360-degree flip
                const maxPitch = Math.PI / 2 - 0.08;
                camera.rotation.x = Math.max(-maxPitch, Math.min(maxPitch, camera.rotation.x));
                camera.rotation.z = 0; // Prevent camera roll tilt
            });

            // Keyboard input
            const onKeyDown = (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                    case 'Space': 
                        if (canJump) {
                            velocity.y += 12;
                            canJump = false;
                        }
                        break;
                    case 'Digit1': selectHotbarSlot(0); break;
                    case 'Digit2': selectHotbarSlot(1); break;
                    case 'Digit3': selectHotbarSlot(2); break;
                    case 'Digit4': selectHotbarSlot(3); break;
                    case 'Digit5': selectHotbarSlot(4); break;
                    case 'Digit6': selectHotbarSlot(5); break;
                    case 'Digit7': selectHotbarSlot(6); break;
                }
            };

            const onKeyUp = (event) => {
                switch (event.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            };

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);

            // Block Break/Place Mouse Clicks
            document.addEventListener('mousedown', (e) => {
                if (!isLocked) return;

                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(Array.from(blocks.values()));

                if (intersects.length > 0 && intersects[0].distance < 8) {
                    const hit = intersects[0];
                    const pos = hit.object.position;

                    if (e.button === 0) {
                        // Left click: Destroy
                        setBlock(pos.x, pos.y, pos.z, null);
                        sfx.playBreak();
                        updateBlockCountUI();
                    } else if (e.button === 2) {
                        // Right click: Place Block on face
                        const normal = hit.face.normal;
                        const newX = pos.x + normal.x;
                        const newY = pos.y + normal.y;
                        const newZ = pos.z + normal.z;

                        // Prevent placing inside camera player position
                        const playerPos = camera.position;
                        const distToPlayer = Math.sqrt(
                            Math.pow(newX - playerPos.x, 2) + 
                            Math.pow(newY - playerPos.y + 0.8, 2) + 
                            Math.pow(newZ - playerPos.z, 2)
                        );

                        if (distToPlayer > 0.8) {
                            setBlock(newX, newY, newZ, selectedBlockType);
                            sfx.playPlace();
                            updateBlockCountUI();
                        }
                    }
                }
            });

            // Prevent context menu on right click
            document.addEventListener('contextmenu', e => e.preventDefault());

            // Hotbar UI Click Event
            document.querySelectorAll('.hotbar-slot').forEach(slot => {
                slot.addEventListener('click', () => {
                    const idx = parseInt(slot.getAttribute('data-index'));
                    selectHotbarSlot(idx);
                });
            });
        }
        // --- Mob System ---
        let mobs = [];

        function createMobMesh(type) {
            const group = new THREE.Group();
            
            if (type === 'pig') {
                const bodyMat = new THREE.MeshLambertMaterial({ color: 0xf4a261 });
                const headMat = new THREE.MeshLambertMaterial({ color: 0xe76f51 });
                
                // Body
                const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 1.0), bodyMat);
                body.position.y = 0.5;
                body.castShadow = true;
                group.add(body);

                // Head
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), headMat);
                head.position.set(0, 0.7, 0.6);
                head.castShadow = true;
                group.add(head);
            } else if (type === 'zombie') {
                const bodyMat = new THREE.MeshLambertMaterial({ color: 0x2a9d8f });
                const clothesMat = new THREE.MeshLambertMaterial({ color: 0x264653 });

                // Legs
                const legs = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.8, 0.4), clothesMat);
                legs.position.y = 0.4;
                group.add(legs);

                // Torso
                const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.4), clothesMat);
                torso.position.y = 1.2;
                group.add(torso);

                // Head
                const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), bodyMat);
                head.position.y = 1.85;
                group.add(head);
            }

            return group;
        }

        function spawnMobs() {
            const mobTypes = ['pig', 'zombie'];
            for (let i = 0; i < 8; i++) {
                const type = mobTypes[Math.floor(Math.random() * mobTypes.length)];
                const mesh = createMobMesh(type);

                const rx = Math.floor(Math.random() * (WORLD_SIZE - 4)) + 2;
                const rz = Math.floor(Math.random() * (WORLD_SIZE - 4)) + 2;
                
                // Find surface height
                let ry = 15;
                while (ry > 0 && !blocks.has(`${rx},${ry},${rz}`)) {
                    ry--;
                }
                ry += 1;

                mesh.position.set(rx, ry, rz);
                scene.add(mesh);

                mobs.push({
                    mesh,
                    type,
                    velocity: new THREE.Vector3(),
                    changeDirTime: 0
                });
            }
        }

        function updateMobs(delta) {
            const time = performance.now();

            mobs.forEach(mob => {
                if (time > mob.changeDirTime) {
                    const angle = Math.random() * Math.PI * 2;
                    mob.velocity.x = Math.cos(angle) * 1.2;
                    mob.velocity.z = Math.sin(angle) * 1.2;
                    mob.changeDirTime = time + 2000 + Math.random() * 3000;
                    mob.mesh.rotation.y = -angle + Math.PI / 2;
                }

                // Simple mob movement & ground collision
                mob.mesh.position.x += mob.velocity.x * delta;
                mob.mesh.position.z += mob.velocity.z * delta;

                // Little bounce / walking animation
                mob.mesh.position.y += Math.sin(time * 0.008) * 0.005;

                // Keep mobs within world bounds
                if (mob.mesh.position.x < 1 || mob.mesh.position.x > WORLD_SIZE - 1) mob.velocity.x *= -1;
                if (mob.mesh.position.z < 1 || mob.mesh.position.z > WORLD_SIZE - 1) mob.velocity.z *= -1;
            });
        }
        // Initialize Scene
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x78a7ff); // Sky blue
            scene.fog = new THREE.FogExp2(0x78a7ff, 0.025);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.rotation.order = 'YXZ'; // Correct Euler rotation order for FPS look
            camera.position.set(WORLD_SIZE / 2, 12, WORLD_SIZE / 2);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Ambient & Directional Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(50, 80, 30);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 150;
            const d = 40;
            sunLight.shadow.camera.left = -d;
            sunLight.shadow.camera.right = d;
            sunLight.shadow.camera.top = d;
            sunLight.shadow.camera.bottom = -d;
            scene.add(sunLight);

            initMaterials();
            scene.add(highlightMesh);

            generateWorld();
            spawnMobs();
            setupControls();

            window.addEventListener('resize', onWindowResize);
        }

        function updateBlockCountUI() {
            document.getElementById('blockCount').innerText = blocks.size;
        }

        // Window resize handler
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Raycast Ray Targeting for Highlight Box
        function updateTargetHighlight() {
            if (!isLocked) {
                highlightMesh.visible = false;
                return;
            }
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(Array.from(blocks.values()));

            if (intersects.length > 0 && intersects[0].distance < 8) {
                const pos = intersects[0].object.position;
                highlightMesh.position.copy(pos);
                highlightMesh.visible = true;
            } else {
                highlightMesh.visible = false;
            }
        }

        // Simple Collision Check
        function checkCollision(position) {
            const radius = 0.3;
            const height = 1.6;

            for (let x = Math.floor(position.x - radius); x <= Math.floor(position.x + radius); x++) {
                for (let y = Math.floor(position.y - height); y <= Math.floor(position.y); y++) {
                    for (let z = Math.floor(position.z - radius); z <= Math.floor(position.z + radius); z++) {
                        if (blocks.has(`${x},${y},${z}`)) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        // Animation / Game Loop
        let frameCount = 0;
        let lastFpsUpdate = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;
            prevTime = time;

            // FPS Counter
            frameCount++;
            if (time - lastFpsUpdate > 500) {
                document.getElementById('fpsCounter').innerText = Math.round((frameCount * 1000) / (time - lastFpsUpdate));
                frameCount = 0;
                lastFpsUpdate = time;
            }

            if (isLocked) {
                // Friction
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 30.0 * delta; // Gravity

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                // Compute horizontal movement vectors aligned with current facing direction
                const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);
                const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), camera.rotation.y);

                const speed = 40.0;
                if (moveForward || moveBackward) {
                    velocity.x += forward.x * direction.z * speed * delta;
                    velocity.z += forward.z * direction.z * speed * delta;
                }
                if (moveLeft || moveRight) {
                    velocity.x += right.x * direction.x * speed * delta;
                    velocity.z += right.z * direction.x * speed * delta;
                }

                // Position update with primitive collision handling
                const oldPos = camera.position.clone();

                // Apply X Movement
                camera.position.x += velocity.x * delta;
                if (checkCollision(camera.position)) camera.position.x = oldPos.x;

                // Apply Z Movement
                camera.position.z += velocity.z * delta;
                if (checkCollision(camera.position)) camera.position.z = oldPos.z;

                // Apply Y Movement (Vertical/Gravity)
                camera.position.y += velocity.y * delta;
                if (checkCollision(camera.position)) {
                    if (velocity.y < 0) {
                        canJump = true;
                    }
                    camera.position.y = oldPos.y;
                    velocity.y = 0;
                }

                // Void fall reset
                if (camera.position.y < -20) {
                    camera.position.set(WORLD_SIZE / 2, 15, WORLD_SIZE / 2);
                    velocity.set(0, 0, 0);
                }

                // Update Pos Counter
                document.getElementById('posCounter').innerText = 
                    `X: ${Math.round(camera.position.x)}, Y: ${Math.round(camera.position.y)}, Z: ${Math.round(camera.position.z)}`;
            }

            updateMobs(delta);
            updateTargetHighlight();
            renderer.render(scene, camera);
        }

        // Start App on Load
        window.onload = () => {
            init();
            animate();
        };
    </script>
</body>
</html>
